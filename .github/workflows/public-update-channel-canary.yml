name: Boostix public update channel canary

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boostix-public-update-channel-canary
  cancel-in-progress: true

jobs:
  verify-public-update-channel:
    name: Verify signed manifests and public installer mirrors
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out trusted canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public update channel without executing installers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\Test-PublicUpdateChannel.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Public update channel canary failed with exit code $LASTEXITCODE."
          }

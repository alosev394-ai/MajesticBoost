name: Boostix CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boostix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Clean build and regression suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read product version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $brandPath = Join-Path $env:GITHUB_WORKSPACE 'ProductBrand.cs'
          $brandSource = [IO.File]::ReadAllText($brandPath)
          $versionMatches = [Text.RegularExpressions.Regex]::Matches(
            $brandSource,
            '(?m)^\s*public\s+const\s+string\s+ProductVersion\s*=\s*"' +
            '(?<version>\d+\.\d+\.\d+)"\s*;\s*$')
          if ($versionMatches.Count -ne 1) {
            throw 'ProductBrand.cs must declare exactly one semantic ProductVersion.'
          }
          $productVersion = $versionMatches[0].Groups['version'].Value
          "BOOSTIX_PRODUCT_VERSION=$productVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BOOSTIX_FILE_VERSION=$productVersion.0" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building Boostix $productVersion."

      - name: Preserve signed release snapshot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $snapshot = Join-Path $env:RUNNER_TEMP (
            'boostix-release-snapshot-' + [Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $snapshot)
          foreach ($name in @(
              'Boostix.exe',
              ('Boostix-Setup-' + $env:BOOSTIX_PRODUCT_VERSION + '.exe'),
              'Boostix-Setup-Latest.exe',
              ('MajesticBoost-Setup-' + $env:BOOSTIX_PRODUCT_VERSION + '.exe')
          )) {
            $source = Join-Path $env:GITHUB_WORKSPACE ('dist\' + $name)
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Signed release snapshot is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (
              Join-Path $snapshot $name)
          }
          foreach ($name in @(
              'update.json',
              'update.json.sig',
              'update-v2.json',
              'update-v2.json.sig'
          )) {
            $source = Join-Path $env:GITHUB_WORKSPACE $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Signed channel snapshot is missing: $source"
            }
            Copy-Item -LiteralPath $source -Destination (
              Join-Path $snapshot $name)
          }
          "BOOSTIX_RELEASE_SNAPSHOT_DIRECTORY=$snapshot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove checked-in build outputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          foreach ($relativePath in @('work', 'dist')) {
            $target = [IO.Path]::GetFullPath((Join-Path $root $relativePath))
            if (-not $target.StartsWith(
                    $root + [IO.Path]::DirectorySeparatorChar,
                    [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to clean a path outside the checkout: $target"
            }
            if (Test-Path -LiteralPath $target) {
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          }

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE `
            -Recurse -Filter '*.ps1' -File)
          if ($files.Count -eq 0) {
            throw 'No PowerShell sources were found.'
          }
          $failures = New-Object 'System.Collections.Generic.List[string]'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors)
            foreach ($error in @($errors)) {
              [void]$failures.Add(
                "$($file.FullName):$($error.Extent.StartLineNumber):" +
                "$($error.Extent.StartColumnNumber) $($error.Message)")
            }
          }
          if ($failures.Count -ne 0) {
            throw [string]::Join([Environment]::NewLine, $failures)
          }
          Write-Host "Parsed $($files.Count) PowerShell files without errors."

      - name: Build Release from source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) {
            throw "Release build failed with exit code $LASTEXITCODE."
          }

      - name: Verify clean build metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Join-Path $env:GITHUB_WORKSPACE 'dist\Boostix.exe'))
          $setup = [Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Join-Path $env:GITHUB_WORKSPACE (
              'dist\Boostix-Setup-' + $env:BOOSTIX_PRODUCT_VERSION + '.exe')))
          foreach ($item in @($app, $setup)) {
            if ($item.ProductName -cne 'Boostix' -or
                $item.CompanyName -cne 'Silas Suspect' -or
                $item.FileVersion -cne $env:BOOSTIX_FILE_VERSION) {
              throw 'A clean-build artifact has incorrect product metadata.'
            }
          }

      - name: Run every regression test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Run-All.ps1 `
            -TestTimeoutSeconds 300 `
            -ResultsPath (Join-Path $env:RUNNER_TEMP 'boostix-test-results.json')
          if ($LASTEXITCODE -ne 0) {
            throw "Regression suite failed with exit code $LASTEXITCODE."
          }

      - name: Run installer lifecycle E2E on disposable runner
        if: ${{ runner.environment == 'github-hosted' }}
        shell: powershell
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:\BOOSTIX_RELEASE_SNAPSHOT_DIRECTORY `
            -ErrorAction SilentlyContinue
          & .\tests\Test-InstallerLifecycleE2E.ps1 -AllowMachineChanges
          if ($LASTEXITCODE -ne 0) {
            throw "Installer lifecycle E2E failed with exit code $LASTEXITCODE."
          }

      - name: Upload machine-readable test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boostix-test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/boostix-test-results.json
          if-no-files-found: warn
          retention-days: 14
